<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Analyzer</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <nav class="nav">
      <a href="/" class="current">analyze</a>
      <a href="/library">library</a>
    </nav>

    <h1>🎧 Audio Analyzer</h1>
    <p class="tagline">Drop in a song — get its tempo, key, and separated stems.</p>

    <form id="upload-form">
      <label class="file-picker" for="file-input" id="file-picker">
        <input type="file" id="file-input"
               accept=".flac,.wav,.mp3,.ogg,.aiff,.aif,.m4a">
        <span id="file-label">Choose an audio file…</span>
      </label>

      <label class="checkbox" id="separate-wrap">
        <input type="checkbox" id="separate-checkbox">
        also separate vocals / instrumental
      </label>

      <label class="checkbox" id="transcribe-wrap">
        <input type="checkbox" id="transcribe-checkbox">
        also transcribe lyrics <span class="exp">(experimental)</span>
      </label>
      <select id="lyrics-source" disabled>
        <option value="mix">from the original mix</option>
        <option value="denoised">denoised — for speech recordings</option>
        <option value="vocals">from the isolated vocals — best for songs</option>
      </select>

      <label class="checkbox" id="practice-wrap">
        <input type="checkbox" id="practice-checkbox">
        make a practice track
      </label>
      <div id="practice-controls" hidden>
        <label>speed
          <input type="number" id="practice-speed" value="0.75"
                 min="0.5" max="1.5" step="0.05">
        </label>
        <label>semitones
          <input type="number" id="practice-semitones" value="0"
                 min="-12" max="12" step="1">
        </label>
      </div>

      <button id="go" disabled>Analyze</button>
    </form>

    <p id="error" hidden></p>

    <section id="results" hidden>
      <h2 id="result-name"></h2>
      <dl id="facts"></dl>

      <details id="chord-details" hidden>
        <summary>chord timeline</summary>
        <div id="chord-timeline"></div>
      </details>

      <details id="structure-details" hidden>
        <summary>song structure</summary>
        <div id="structure-timeline"></div>
      </details>

      <label class="checkbox" id="practice-wrap">
        <input type="checkbox" id="practice-checkbox">
        make a practice track
      </label>
      <button id="mix-button" class="secondary" hidden>
        Build a mix from this track
      </button>
      <details id="mix-details" hidden>
        <summary>suggested mix</summary>
        <div id="mix-list"></div>
      </details>

      <div id="separation" hidden>
        <p id="sep-status">queued…</p>
        <div id="stems" hidden></div>
      </div>

      <div id="lyrics" hidden>
        <p id="lyrics-status">queued…</p>
        <pre id="lyrics-text" hidden></pre>
      </div>

      <div id="practice-section" hidden>
        <p id="practice-status">queued…</p>
        <div class="stem">
          <span class="stem-name">practice</span>
          <audio controls preload="none" id="practice-player"></audio>
          <a id="practice-download" download="practice.flac">download</a>
        </div>
      </div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
